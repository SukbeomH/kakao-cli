# 기본 배포 구성. 기존 Android 재생성 시 같은 /data bind를 유지한다.
# 구성 참고: rokrokss/kakaotalk-bridge @097a9b8 (MIT), NOTICE 참조.
name: android-console
services:
  redroid:
    image: redroid/redroid:14.0.0-latest@sha256:a3e654caad74faed03cd5ead057a989e06f507778cda678e5d3b9772e0092f1c
    privileged: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - type: bind
        source: ${ANDROID_CONSOLE_DATA:-/opt/android-console/data}
        target: /data
        bind:
          create_host_path: false
      # binderfs inode 자체를 bind. 복제한 문자 장치 노드는 사용하지 않는다.
      - type: bind
        source: /dev/binderfs/binder
        target: /dev/binder
        bind:
          create_host_path: false
      - type: bind
        source: /dev/binderfs/hwbinder
        target: /dev/hwbinder
        bind:
          create_host_path: false
      - type: bind
        source: /dev/binderfs/vndbinder
        target: /dev/vndbinder
        bind:
          create_host_path: false
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=240
      - androidboot.redroid_fps=${ANDROID_CONSOLE_FPS:-60}
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=1
      - ro.adb.secure=0
    healthcheck:
      test: ["CMD", "/system/bin/sh", "-c", "test $$(getprop sys.boot_completed) = 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  webui:
    image: android-console:local
    build: .
    restart: unless-stopped
    command: [serve, --connect, redroid:5555, --serial, redroid:5555, --host, 0.0.0.0, --port, "8801", --allow-screen, --fs-root, /files]
    ports:
      - "${ANDROID_CONSOLE_BIND:-127.0.0.1}:8801:8801"
    volumes:
      - adb-state:/root/.android
      - console-files:/files
      - scrcpy-cache:/root/.cache/android-console
    depends_on:
      redroid:
        condition: service_healthy
volumes:
  adb-state:
  console-files:
  scrcpy-cache:
