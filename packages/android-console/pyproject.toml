[project]
name = "android-console"
version = "0.1.0"
description = "Standalone browser console for ADB-connected Android devices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
android-console = "android_console.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_console"]

[tool.hatch.build.targets.sdist]
include = ["src/android_console", "README.md", "pyproject.toml"]
