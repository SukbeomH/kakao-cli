# VM 108 live overlay: preserve data/binder setup, explicitly use 60Hz, and expose on the LAN.
services:
  redroid:
    command:
      - androidboot.redroid_width=1600
      - androidboot.redroid_height=2560
      - androidboot.redroid_dpi=340
      - androidboot.redroid_fps=${KAKAO_ANDROID_FPS:-60}
      - androidboot.redroid_gpu_mode=guest
      - ro.product.manufacturer=samsung
      - ro.product.brand=samsung
      - ro.product.model=SM-X710
      - ro.product.name=gts9wifixx
      - ro.product.device=gts9wifi
      - ro.build.characteristics=tablet
    volumes: !override
      - type: bind
        source: /opt/redroid/data
        target: /data
        bind:
          create_host_path: false
  webui:
    ports: !override
      - "192.168.0.30:8800:8800"
