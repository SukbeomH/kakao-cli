[project]
name = "kakao-cli"
version = "0.1.0"
description = "Linux CLI that drives the official KakaoTalk Android app in Waydroid via adb"
requires-python = ">=3.11"
dependencies = []  # pure stdlib + external `adb` binary

[project.scripts]
kakao = "kakao_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kakao_cli"]
