[project]
name = "kakao-cli"
version = "0.1.2"
description = "Read-only DB reception and UI automation for the official KakaoTalk Android app"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["kakaotalk", "adb", "android", "automation", "redroid", "waydroid", "cli"]
dependencies = ["cryptography>=41"]  # DB AES-CBC; UI transport uses external adb

[project.scripts]
kakao = "kakao_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kakao_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/kakao_cli", "scripts", "docs", "completions", "README.md", "deploy", "NOTICE", "Dockerfile", ".dockerignore"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "kakao_cli/NOTICE"
